name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: bun install --frozen-lockfile
      # Pre-publish gate: suite must be green before anything is built or
      # published. If this fails, no tarballs reach npm. (km 19772 Phase 0)
      - run: bun run test
      - run: bun run build:all
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Pre-publish gate: check exact tarballs through the pinned verifier.
      # If this fails, no tarballs reach npm.
      - name: Verify publishable artifacts
        run: bun run verify-publishable --no-build

      # Publish packages in dependency order
      # Skip if version already published (idempotent)
      # Use `pnpm publish` (not `npm publish`) so `publishConfig.exports`
      # overrides apply — npm ignores them, leaving consumers with
      # `exports → ./src/index.ts` and broken installs (see 0.19.0).
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            local dir=$1
            local pkg="./$dir/package.json"
            if [ ! -f "$pkg" ]; then
              echo "⚠ $dir/package.json not found — skipping"
              return 0
            fi
            local name=$(node -e "console.log(require('$pkg').name)")
            local version=$(node -e "console.log(require('$pkg').version)")
            local private=$(node -e "console.log(require('$pkg').private === true)")
            if [ "$private" = "true" ]; then
              echo "🔒 $name@$version is private — skipping"
              return 0
            fi
            local published=$(npm view "$name@$version" version 2>/dev/null || echo "")
            if [ "$published" = "$version" ]; then
              echo "⏭ $name@$version already published"
            else
              echo "📦 Publishing $name@$version..."
              (cd $dir && pnpm publish --access public --no-git-checks)
            fi
          }

          # Layer 1: Core types (no internal deps)
          publish packages/command
          publish packages/ag

          # Layer 2: Depends on ag
          publish packages/ag-react
          publish packages/scope
          publish packages/signals
          publish packages/color
          publish packages/headless

          # Layer 3: Depends on ag + ag-react
          publish packages/theme
          publish packages/ag-term
          publish packages/ansi
          publish packages/commands

          # Layer 4: Depends on ag-term
          publish packages/ink
          publish packages/create
          publish packages/test
          publish packages/commander
          publish packages/config
          publish packages/syntax

          # Layer 5: Root barrel (depends on everything)
          publish .

          # Layer 6: Examples (depends on silvery)
          publish examples

      # Smoke test: verify the JUST-PUBLISHED version resolves correctly.
      # Pin to ${{ github.ref_name }} (e.g. v0.19.2 → 0.19.2) instead of
      # `npm install silvery` (which resolves the `latest` dist-tag and
      # races with CDN propagation immediately after publish).
      # v0.24.0 exhausted a 60s window and the re-run passed minutes later,
      # so the budget is 10 minutes with 5s backoff doubling to a 60s cap.
      # Every attempt prints elapsed seconds, and a first-attempt miss is
      # called out on success: a slow propagation must stay visible in the
      # log rather than being smoothed away by the wider window.
      - name: Smoke test
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir=$(mktemp -d)
          cd "$dir"
          npm init -y --silent
          echo "Installing silvery@$version from npm..."
          budget=600
          delay=5
          attempt=0
          start=$SECONDS
          while :; do
            attempt=$((attempt + 1))
            elapsed=$((SECONDS - start))
            echo "--- attempt $attempt at ${elapsed}s elapsed (budget ${budget}s) ---"
            if npm install --no-package-lock "silvery@$version" 2>&1; then
              elapsed=$((SECONDS - start))
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::silvery@$version needed $attempt attempts over ${elapsed}s to propagate to the registry"
              fi
              break
            fi
            elapsed=$((SECONDS - start))
            if [ "$elapsed" -ge "$budget" ]; then
              echo "silvery@$version did not propagate to the registry within ${budget}s ($attempt attempts, ${elapsed}s elapsed)"
              exit 1
            fi
            echo "Registry has not propagated silvery@$version yet (${elapsed}s elapsed); retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            if [ "$delay" -gt 60 ]; then delay=60; fi
          done
          echo "Verifying import..."
          node --experimental-strip-types -e "import 'silvery'" 2>&1
          echo "✅ Smoke test passed for silvery@$version after $((SECONDS - start))s"
          rm -rf "$dir"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
