name: Verify Publishable

# The pinned verify-publishable command builds and checks every public package
# from its exact tarball through an isolated registry and fresh Node consumer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            sleep $((attempt * 10))
          done
          bun install --frozen-lockfile

      - name: Verify publishable artifacts
        run: bun run verify-publishable
