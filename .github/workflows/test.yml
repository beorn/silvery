name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same ref are wasted minutes — cancel them.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` lets an upstream bun release break CI spuriously,
          # and this workflow is load-bearing for the km vendor-pin gate.
          bun-version: "1.3.14"

      # setup-bun caches only the bun BINARY; cache the install cache ourselves.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: ./.github/actions/source-siblings

      - name: Type check
        run: bun run typecheck

      # Grep gates — cheap, run before the test suite so ownership/hygiene
      # violations fail fast (raw-mode owner routing, async unmount, env reads).
      - name: Lint gates
        run: bun scripts/lint-env-reads.ts && bun scripts/lint-no-raw-mode.ts && bun scripts/lint-no-async-unmount.ts && bun scripts/lint-no-in-flight-rect-in-app.ts

      - name: Run tests
        run: bun run test
